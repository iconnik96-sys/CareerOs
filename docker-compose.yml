

services:
  careeros-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
        - VITE_AI_BACKEND_URL=${VITE_AI_BACKEND_URL:-http://localhost:8000}
    container_name: careeros-app
    ports:
      - "3000:80"
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - VITE_AI_BACKEND_URL=http://localhost:8000
    depends_on:
      - careeros-ai-backend
    restart: unless-stopped

  careeros-ai-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careeros-ai-engine
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
    restart: unless-stopped


